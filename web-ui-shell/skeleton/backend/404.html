<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>
    <style>
      :root {
        font-family: system-ui, Avenir, Helvetica, Arial, sans-serif;
        line-height: 1.5;
        font-weight: 400;
        color-scheme: light dark;
        color: rgba(255, 255, 255, 0.87);
        background-color: #242424;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        margin: 0;
        display: flex;
        place-items: center;
        min-width: 320px;
        min-height: 100vh;
      }
      a {
        font-weight: 500;
        color: #646cff;
        text-decoration: inherit;
      }
      a:hover {
        color: #535bf2;
      }
      h1 {
        font-size: 3.2em;
        line-height: 1.1;
        margin: 0 0 0.6em;
      }
      p {
        margin: 0.3em 0 1.6em;
      }
      .page {
        max-width: 1280px;
        margin: 0 auto;
        padding: 2rem;
        text-align: center;
      }
      .card {
        padding: 2em;
      }
      .actions {
        display: flex;
        justify-content: center;
        gap: 0.8em;
        flex-wrap: wrap;
      }
      .button {
        border-radius: 8px;
        border: 1px solid transparent;
        padding: 0.6em 1.2em;
        font-size: 1em;
        font-weight: 500;
        font-family: inherit;
        background-color: #1a1a1a;
        cursor: pointer;
        transition: border-color 0.25s;
        display: inline-block;
      }
      .button:hover {
        border-color: #646cff;
      }
      .button:focus,
      .button:focus-visible {
        outline: 4px auto -webkit-focus-ring-color;
      }
      .read-the-docs {
        color: #888;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color: #213547;
          background-color: #ffffff;
        }
        a:hover {
          color: #747bff;
        }
        .button {
          background-color: #f9f9f9;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="card">
        <h1>404</h1>
        <p>That page does not exist.</p>
        <div class="actions">
          <a class="button" href="/">Go to home</a>
          <a class="button" href="/shell">Open shell app</a>
        </div>
      </div>
      <p class="read-the-docs">If you typed the address, check for typos.</p>
    </main>
  </body>
</html>
