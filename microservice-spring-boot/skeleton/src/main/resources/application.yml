spring:
  application:
    name: ${APPLICATION_NAME:enterprise}
  security:
    cors:
      allowed-origins: ${SECURITY_CORS_ALLOWED_ORIGINS:}
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - Authorization
        - Content-Type
      allow-credentials: true
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SECURITY_AUTH_SERVER_ISSUER_URI}
      authorizationserver:
        endpoint:
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/${SECURITY_AUTH_SERVER_JWK_SET_ENDPOINT}
server:
  port: ${SERVER_PORT:8080}