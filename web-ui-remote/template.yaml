apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: react-typescript-vite-template
  title: React with Typescript Vite Template
  description: |
    Template to create a production-ready React Web UI application on Typescript based on Vite.
  tags:
    - recommended
    - react
    - typescript
    - vite
spec:
  system: web-ui-remote
  owner: group:coe-solarch
  type: website

  parameters:
    - title: Provide information about the new component
      required:
        - name
      properties:
        name:
          title: Service name
          type: string
          default: react-ui
        description:
          title: Description
          type: string
          description: A production-ready React Web UI application on Typescript based on Vite
        system:
          title: System
          type: string
          description: System of the component
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: System

    - title: Select the owner of the new component
      required:
        - owner
      properties:
        owner:
          title: Service Owner
          type: string
          description: Owner of the newly created component in the Backstage catalog
          default: group:coe-solarch
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

    - title: Choose a location
      required:
        - repoUrl
        - repoBranch
      properties:
        repoUrl:
          title: Repository Location
          type: string
          description: Organization that owns the repository in github
          ui:field: RepoUrlPicker
          ui:options:
            allowedOrganizations:
              - gh-42172
            requestUserCredentials:
              secretsKey: USER_OAUTH_TOKEN
            allowedHosts:
              - github.com
        repoBranch:
          title: Repository Branch
          type: string
          default: main
          ui:field: RepoBranchPicker
          ui:options:
            requestUserCredentials:
              secretsKey: USER_OAUTH_TOKEN

  steps:
    - id: fetch-base
      name: Fetch Base
      action: fetch:template
      input:
        url: ./skeleton
        copyWithoutTemplating:
          - .github/workflows/*
        values:
          name: ${{ parameters.name }}
          system: ${{ parameters.system }}
          description: ${{ parameters.description }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}
          owner: ${{ parameters.owner }}

    - id: publish
      name: Publishing to the Source Code Repository
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        token: ${{ secrets.USER_OAUTH_TOKEN }}
        defaultBranch: ${{ parameters.repoBranch }}
        repoVisibility: private

    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: "/catalog-info.yaml"

  output:
    links:
      - title: Open the Source Code Repository
        url: ${{ steps['publish'].output.repoContentsUrl }}
      - title: Open the Catalog Info Component
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
