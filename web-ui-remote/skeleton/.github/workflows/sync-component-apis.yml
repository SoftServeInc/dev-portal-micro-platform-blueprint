name: Sync Component APIs with Backstage Catalog

on:
  push:
    paths:
      - 'src/api/specs/*-api.yaml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync-component-apis:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download SnakeYAML to local lib directory
        run: |
          mkdir -p .github/scripts/lib
          curl -sSL -o .github/scripts/lib/snakeyaml.jar https://repo1.maven.org/maven2/org/yaml/snakeyaml/2.2/snakeyaml-2.2.jar

      - name: Compile BackstageApiCatalogUpdater.java
        run: |
          javac -cp .github/scripts/lib/snakeyaml.jar:. .github/scripts/BackstageApiCatalogUpdater.java

      - name: Run BackstageApiCatalogUpdater
        run: |
          java -cp .github/scripts/lib/snakeyaml.jar:.github/scripts BackstageApiCatalogUpdater

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: feat/sync-component-apis-${{ github.run_number }}
          commit-message: "chore: Resolve APIs in Catalog Component"
          title: Sync Component APIs
          body: |
            This PR was automatically created by the Sync Component APIs workflow.

            Changes included:
            - Updated consumesApis section with latest consumed APIs

            Please review the changes and merge if appropriate.
          labels: |
            automated-pr
            api-sync
          delete-branch: true